stages:
  - deploy

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: fetch

update_sourcecodes_staging:
  stage: deploy
  tags:
    - staging-stbip-u1
  resource_group: staging-stbip
  script:
    - echo "Updating codebase and deploying containers"
    - cd "$PROJECT_DIRECTORY"
    - git stash
    - git fetch
    - git checkout "$CI_COMMIT_SHA"
    - git rev-parse HEAD
    - grep -q "Schema::hasColumn('notes', 'userid')" database/migrations/2026_01_04_042206_add_userid_and_active_to_notes_table.php
    - mkdir -p /var/lib/stbip
    - if docker compose ps -q stbip | grep -q .; then docker compose cp stbip:/var/www/html/database/database.sqlite /var/lib/stbip/database.sqlite.previous || true; fi
    - if [ -f /var/lib/stbip/database.sqlite.previous ]; then cp /var/lib/stbip/database.sqlite.previous database/database.sqlite; fi
    - docker compose up -d --build --force-recreate
    - docker compose exec -T stbip sh -lc 'if grep -q "^DB_CONNECTION=sqlite[[:space:]]*$" .env; then export DB_DATABASE=/var/www/html/database/database.sqlite; fi; php artisan migrate --force --isolated'
    - docker compose exec -T stbip sh -lc 'if grep -q "^DB_CONNECTION=sqlite[[:space:]]*$" .env; then export DB_DATABASE=/var/www/html/database/database.sqlite; fi; php artisan optimize:clear'
    - docker compose cp stbip:/var/www/html/database/database.sqlite /var/lib/stbip/database.sqlite
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - .gitlab-ci.yml