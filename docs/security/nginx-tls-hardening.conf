# Restrict TLS to modern protocols and AEAD-only ciphers.
# TLS 1.3 suites are negotiated separately by OpenSSL and already exclude CBC/static RSA.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_ecdh_curve X25519:secp384r1:prime256v1;
ssl_session_tickets off;

# Optional OCSP stapling, if the certificate chain and resolver are configured in the vhost.
# ssl_stapling on;
# ssl_stapling_verify on;
